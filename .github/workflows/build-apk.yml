name: Build Sulav Proxy APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      # Use a runner-local gradle cache to avoid polluting home; helps cache step.
      GRADLE_USER_HOME: ${{ runner.temp }}/.gradle-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show runner info
        run: |
          echo "Java version:"
          java -XshowSettings:properties -version 2>&1 | sed -n '1,5p' || true
          echo "Gradle wrapper version:"
          ./gradlew --version || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Gradle and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*','gradle.properties') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      - name: Set up Android SDK (tools only)
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Cache Android SDK components (optional)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platform-tools
            ${{ env.ANDROID_SDK_ROOT }}/platforms
            ${{ env.ANDROID_SDK_ROOT }}/build-tools
          key: android-sdk-${{ runner.os }}-android-35
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Cache Gradle build outputs
        uses: actions/cache@v4
        with:
          path: |
            app/.gradle
            app/build
          key: gradle-build-output-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            gradle-build-output-${{ runner.os }}-

      - name: Build debug APK
        id: build
        run: |
          # enable parallel/configure-on-demand for faster builds
          ./gradlew assembleDebug \
            -x test \
            --no-daemon \
            --build-cache \
            --stacktrace \
            --parallel \
            --configure-on-demand

      - name: List APKs for debugging
        if: always()
        run: |
          echo "Looking for APKs under app/build/outputs/apk"
          find app/build/outputs/apk -maxdepth 4 -type f -name "*.apk" -print || true

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SulavProxy-debug-apk-${{ github.run_id }}-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_id }}
          path: app/build/reports/
          retention-days: 7
          if-no-files-found: warn

      # Optional: Sign a release build and upload (example placeholder)
      # - name: Decode and install keystore
      #   if: secrets.KEYSTORE_BASE64
      #   run: |
      #     echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-keystore.jks
      #     # use jarsigner or Gradle signing config to sign the APK
      #   env:
      #     KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
