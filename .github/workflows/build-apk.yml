name: Build Sulav Proxy APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ github.ref }}-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-cache-${{ github.ref }}-
            gradle-cache-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"

      - name: Setup Gradle Wrapper
        run: |
          # Check if gradlew exists
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "✅ Using existing gradlew"
            exit 0
          fi

          # Install gradle if wrapper missing
          echo "📦 Installing Gradle..."
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH=$PWD/gradle-8.5/bin:$PATH
          gradle --version

          # Generate wrapper
          gradle wrapper
          chmod +x ./gradlew

          # Download wrapper jar if needed
          if [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            mkdir -p gradle/wrapper
            wget -q -O gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.5/gradle/wrapper/gradle-wrapper.jar
          fi

          echo "✅ Gradle wrapper generated"

      - name: Build APK
        run: |
          # Check if build.gradle or build.gradle.kts exists
          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ] && [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "❌ No build.gradle file found!"
            echo "Current directory contents:"
            ls -la
            echo "Trying to find gradle files:"
            find . -name "*.gradle*" -type f 2>/dev/null || echo "No gradle files found"
            exit 1
          fi
          
          # Check if the app is in a subdirectory
          if [ -f "app/build.gradle" ] || [ -f "app/build.gradle.kts" ]; then
            echo "Building app from 'app' directory"
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            echo "Building from root directory"
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sulav-proxy-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/*/*.apk
            *.apk
          if-no-files-found: error

      - name: Generate Download Link
        run: |
          echo "### ✅ APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The APK artifact is available in the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To download:" >> $GITHUB_STEP_SUMMARY
          echo "1. Click on the **Summary** tab" >> $GITHUB_STEP_SUMMARY
          echo "2. Scroll down to **Artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "3. Download **sulav-proxy-apk**" >> $GITHUB_STEP_SUMMARY
