name: Build Sulav Proxy APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK with run number
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/SulavProxy-debug-${{ github.run_number }}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SulavProxy-debug-apk
          path: dist/SulavProxy-debug-${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Sulav Proxy build #${{ github.run_number }}"
          files: dist/SulavProxy-debug-${{ github.run_number }}.apk
          generate_release_notes: false

      - name: Print download link
        run: |
          echo "APK build finished."
          echo "Direct download link:"
          echo "${{ github.server_url }}/${{ github.repository }}/releases/download/build-${{ github.run_number }}/SulavProxy-debug-${{ github.run_number }}.apk"
          echo "::notice title=APK Download::${{ github.server_url }}/${{ github.repository }}/releases/download/build-${{ github.run_number }}/SulavProxy-debug-${{ github.run_number }}.apk"
