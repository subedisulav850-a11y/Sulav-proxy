name: Build Sulav Proxy APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      # Use a repo-local gradle cache directory (avoid runner.* in expressions)
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show repo root contents (diagnostic)
        run: |
          echo "Repository root: $GITHUB_WORKSPACE"
          ls -la || true
          echo "Looking for any gradlew files..."
          find . -maxdepth 6 -name gradlew -print -exec ls -la {} \; || true

      - name: Make gradlew executable (if present)
        run: |
          # Make any gradlew wrapper files executable to avoid 'command not found' (exit 127)
          find . -name gradlew -print -exec chmod +x {} \; || true

      - name: Show runner info
        run: |
          echo "Java version:"
          java -XshowSettings:properties -version 2>&1 | sed -n '1,5p' || true
          echo "Gradle wrapper version (if gradlew present):"
          if [ -x ./gradlew ]; then
            ./gradlew --version || true
          else
            echo "No executable gradlew at repo root; running 'gradle --version' if available"
            gradle --version || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Gradle and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ github.ref }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*','gradle.properties') }}
          restore-keys: |
            gradle-cache-${{ github.ref }}-

      - name: Set up Android SDK (tools only)
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages (including build-tools)
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"
          echo "Installed SDK root: $ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT" || true
          sdkmanager --list || true

      - name: Show gradlew (permissions + hash) and run version check
        run: |
          set -euxo pipefail
          echo "Looking for gradlew in repo..."
          find . -maxdepth 6 -name gradlew -print -exec ls -la {} \; || true
          # Make wrapper executable if present
          find . -name gradlew -exec chmod +x {} \; || true
          if [ -x ./gradlew ]; then
            echo "gradlew is executable at repo root; showing version:"
            ./gradlew --version || true
          else
            echo "No executable gradlew at repo root; will try system 'gradle --version'"
            gradle --version || true
          fi

      - name: Build debug APK (verbose)
        run: |
          set -euxo pipefail
          echo "Starting Gradle assembleDebug (stacktrace + info)..."
          if [ -x ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon --console=plain --stacktrace --info
          else
            gradle assembleDebug --no-daemon --console=plain --stacktrace --info
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sulav-proxy-apk
          path: |
            **/*.apk

      - name: Write APK download link to job summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          artifact_name: "sulav-proxy-apk"
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          run_id="${GITHUB_RUN_ID}"
          name="${artifact_name}"

          echo "Querying artifacts for repo=${repo} run_id=${run_id} to find artifact named ${name}"

          artifacts_json=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${repo}/actions/runs/${run_id}/artifacts")

          # Parse with a single-line python to avoid multiline/YAML escaping issues
          artifact_id=$(printf '%s' "$artifacts_json" | python3 -c "import os,sys,json; name=os.environ.get('artifact_name'); d=json.load(sys.stdin); arts=d.get('artifacts',[]); print(next((a.get('id') for a in arts if a.get('name')==name), ''))")

          if [ -n "$artifact_id" ]; then
            echo "Found artifact id: ${artifact_id}"
            download_url="https://api.github.com/repos/${repo}/actions/artifacts/${artifact_id}/zip"
            echo "Download (requires authentication): ${download_url}"
            echo "### APK artifact\n\nDownload (requires authentication): ${download_url}" >> "${GITHUB_STEP_SUMMARY}"
            echo "apk_download_url=${download_url}" >> "${GITHUB_OUTPUT}"
          else
            echo "Artifact not found in current run's artifacts list."
            echo "APK artifact was uploaded but couldn't locate it via the run artifacts API." >> "${GITHUB_STEP_SUMMARY}"
          fi
