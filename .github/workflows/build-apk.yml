name: Build Sulav Proxy APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      # Use a repo-local gradle cache directory (avoid runner.* in expressions)
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show runner info
        run: |
          echo "Java version:"
          java -XshowSettings:properties -version 2>&1 | sed -n '1,5p' || true
          echo "Gradle wrapper version:"
          ./gradlew --version || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Gradle and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ github.ref }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*','gradle.properties') }}
          restore-keys: |
            gradle-cache-${{ github.ref }}-

      - name: Set up Android SDK (tools only)
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35"

      # Build APK(s)
      - name: Build debug APK
        run: |
          echo "Starting Gradle assembleDebug..."
          ./gradlew assembleDebug --no-daemon --console=plain

      # Upload any APKs found under the repo as an artifact for easy download from the run
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sulav-proxy-apk
          path: |
            **/*.apk

      # Print a download URL (requires auth) to the job summary so it's easy to find
      - name: Write APK download link to job summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          repo=${GITHUB_REPOSITORY}
          artifact_name="sulav-proxy-apk"

          echo "Querying artifacts for ${repo} to find artifact named ${artifact_name}"

          # Query artifacts in the repository's Actions artifacts list and find the matching artifact id
          artifact_id=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" "https://api.github.com/repos/${repo}/actions/artifacts" \
            | python -c "import sys,json; d=json.load(sys.stdin); arts=d.get('artifacts',[]);\
for a in arts:\
  if a.get('name')=='${artifact_name}':\
    print(a.get('id')); break")

          if [ -n "$artifact_id" ]; then
            echo "Found artifact id: $artifact_id"
            download_url="https://api.github.com/repos/${repo}/actions/artifacts/${artifact_id}/zip"
            echo "Download (requires authentication): $download_url"
            echo "### APK artifact\n\nDownload (requires authentication): $download_url" >> "$GITHUB_STEP_SUMMARY"
            # Also expose as a job output for downstream usage
            echo "apk_download_url=$download_url" >> "$GITHUB_OUTPUT"
          else
            echo "Artifact not found in repository artifacts list."
            echo "APK artifact was uploaded but couldn't locate it via the repository artifacts API." >> "$GITHUB_STEP_SUMMARY"
          fi
