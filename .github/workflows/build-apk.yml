name: Build Sulav Proxy APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      # Use a repo-local gradle cache directory (avoid runner.* in expressions)
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show runner info
        run: |
          echo "Java version:"
          java -XshowSettings:properties -version 2>&1 | sed -n '1,5p' || true
          echo "Gradle wrapper version:"
          ./gradlew --version || true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Gradle and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ github.ref }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*','gradle.properties') }}
          restore-keys: |
            gradle-cache-${{ github.ref }}-

      - name: Set up Android SDK (tools only)
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35"

      # Build APK(s)
      - name: Build debug APK
        run: |
          echo "Starting Gradle assembleDebug..."
          ./gradlew assembleDebug --no-daemon --console=plain

      # Upload any APKs found under the repo as an artifact for easy download from the run
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sulav-proxy-apk
          path: |
            **/*.apk

      # Print a download URL (requires auth) to the job summary so it's easy to find
      - name: Write APK download link to job summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          artifact_name: "sulav-proxy-apk"
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          run_id="${GITHUB_RUN_ID}"
          artifact_name="${artifact_name}"

          echo "Querying artifacts for repo=${repo} run_id=${run_id} to find artifact named ${artifact_name}"

          artifacts_json=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${repo}/actions/runs/${run_id}/artifacts")

          # Use python3 (available on ubuntu runners) to parse JSON safely
          artifact_id=$(printf "%s" "${artifacts_json}" | python3 - <<'PY'
import os,sys,json
name = os.environ.get('artifact_name')
try:
    d = json.load(sys.stdin)
except Exception:
    sys.exit(0)
for a in d.get('artifacts', []):
    if a.get('name') == name:
        print(a.get('id'))
        break
PY
)

          if [ -n "${artifact_id}" ]; then
            echo "Found artifact id: ${artifact_id}"
            download_url="https://api.github.com/repos/${repo}/actions/artifacts/${artifact_id}/zip"
            echo "Download (requires authentication): ${download_url}"
            echo "### APK artifact\n\nDownload (requires authentication): ${download_url}" >> "${GITHUB_STEP_SUMMARY}"
            echo "apk_download_url=${download_url}" >> "${GITHUB_OUTPUT}"
          else
            echo "Artifact not found in current run's artifacts list."
            echo "APK artifact was uploaded but couldn't locate it via the run artifacts API." >> "${GITHUB_STEP_SUMMARY}"
          fi
