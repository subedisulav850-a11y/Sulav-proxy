name: Build Sulav Proxy APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-cache
      GRADLE_OPTS: -Xmx2g -Dorg.gradle.jvmargs=-Xmx2g

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show repo root contents (diagnostic)
        run: |
          echo "Repository root: $GITHUB_WORKSPACE"
          ls -la
          echo "=== Looking for gradle-related files ==="
          find . -maxdepth 3 -name "gradle*" -o -name "*.gradle" | head -20

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Gradle and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ github.ref }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*','gradle.properties') }}
          restore-keys: |
            gradle-cache-${{ github.ref }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"

      - name: Check for gradlew and generate if missing
        run: |
          set -euxo pipefail
          
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            echo "✅ gradlew found and made executable"
            exit 0
          fi
          
          if [ -f ./gradle/wrapper/gradle-wrapper.jar ] && [ -f ./gradle/wrapper/gradle-wrapper.properties ]; then
            echo "⚠️ Found gradle wrapper files but no gradlew script"
            echo "Generating gradlew script..."
            
            WRAPPER_VERSION=$(grep distributionUrl ./gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-\([0-9.]*\)-.*/\1/')
            
            cat > ./gradlew << 'EOFGRADLEW'
            #!/bin/sh
            exec java -cp "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
            EOFGRADLEW
            
            chmod +x ./gradlew
            
            if [ ! -f ./gradle/wrapper/gradle-wrapper.jar ]; then
              echo "Downloading gradle-wrapper.jar..."
              curl -L -o ./gradle/wrapper/gradle-wrapper.jar "https://github.com/gradle/gradle/raw/v${WRAPPER_VERSION}/gradle/wrapper/gradle-wrapper.jar"
            fi
            
            echo "✅ Generated gradlew script"
          else
            echo "❌ No gradle wrapper found in repository"
            echo "Please run './gradlew wrapper' locally and commit:"
            echo "  - gradlew"
            echo "  - gradlew.bat"
            echo "  - gradle/wrapper/gradle-wrapper.jar"
            echo "  - gradle/wrapper/gradle-wrapper.properties"
            exit 1
          fi

      - name: Verify gradlew is working
        run: |
          ./gradlew --version

      - name: Build debug APK
        run: |
          set -euxo pipefail
          ./gradlew assembleDebug --no-daemon --console=plain --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sulav-proxy-apk
          path: |
            **/*.apk

      - name: Write APK download link to job summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          if [ -n "${{ github.token }}" ]; then
            echo "### APK Artifact URL" >> "${GITHUB_STEP_SUMMARY}"
            echo "The APK will be available in the 'Artifacts' section above once the build completes." >> "${GITHUB_STEP_SUMMARY}"
          fi
